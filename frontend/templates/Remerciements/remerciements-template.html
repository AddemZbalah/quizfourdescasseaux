<section class="remerciements">
  <div class="remerciements_check" aria-hidden="true">
    <svg
      class="remerciements__icon"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="3"
    >
      <path d="M5 13l4 4L19 7" />
    </svg>
  </div>

  <div class="remerciements_content">
    <h1 class="remerciements_title">Merci !</h1>
    <p class="remerciements_text">
      Nous esperons que vous avez passé une bonne visite
    </p>
  </div>

  <button
    onclick="C.start()"
    class="remerciements_btn"
    aria-label="Retourner a l'accueil"
  >
    <img
      class="remerciements__buttonimg icon-left"
      src="./frontend/assets/arrow_left.svg"
      alt=""
    />
    <span>Retourner a l'accueil</span>
  </button>
