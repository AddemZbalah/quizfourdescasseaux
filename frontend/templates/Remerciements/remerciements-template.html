<section class="remerciements-main">
  <div class="remerciements-check" aria-hidden="true">
    <div class="remerciements-check__halo"></div>
    <div class="remerciements-check__ring">
      <svg
        class="remerciements-check__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
      >
        <path d="M5 13l4 4L19 7" />
      </svg>
    </div>
  </div>

  <div class="remerciements-content">
    <h1 class="remerciements-title">Merci !</h1>
    <p class="remerciements-text">
      Nous esperons que vous avez passé une bonne visite
    </p>
  </div>

  <button
    onclick="C.start()"
    class="btn-submit remerciements-btn btn-submit--reverse"
    aria-label="Retourner a l'accueil"
  >
    <img
      class="remerciements-btn__icon"
      src="./frontend/assets/arrow_left.svg"
      alt=""
    />
    <span>Retourner a l'accueil</span>
  </button>
</section>
