<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Backoffice - Four des Casseaux</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <link rel="stylesheet" href="./admin.css">
  <link rel="stylesheet" href="./login.css">
</head>

<body>

  <div class="login-wrapper">
    <div class="login-container">
      <div class="login-logo">
        <img src="../assets/cropped-site-e1576939597289.webp" alt="Logo Four des Casseaux"
          onerror="this.style.display='none'">
      </div>
      <h2 class="login-title">Accès Restreint</h2>

      <form id="loginForm">
        <div id="loginMessage" class="hidden"></div>

        <div class="form-group">
          <label for="username">Identifiant (admin)</label>
          <input type="text" id="username" class="form-input" required placeholder="admin">
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" class="form-input" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; font-size: 1.1rem; padding: 12px;">Se
          connecter</button>
      </form>
    </div>
  </div>

  <script src="./login.js"></script>
</body>

</html>
