<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four des Casseaux - Texte</title>
  <link href="/src/style.css" rel="stylesheet">
</head>

<body class="app">
  <header class="header">
    <button class="header__button" aria-label="Retour">
      <svg class="header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <img class="header__logo" src="/src/assets/logo.png" alt="Logo Four des Casseaux">
    <button class="header__button" aria-label="Menu">
      <svg class="header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12h18M3 6h18M3 18h18" />
      </svg>
    </button>
  </header>

  <main class="w-full flex-1 flex flex-col items-center">
    <section class="question-info">
      <h1 class="question-info__title">QUESTION</h1>
      <p class="question-info__progress" id="progress-indicator"></p>
    </section>

    <section class="card">
      <div class="card__question-text">
        <ol id="question-list" class="list-decimal ml-4">
          <li id="question-title"></li>
        </ol>
      </div>

      <div class="text-answer">
        <textarea id="text-answer-input" class="text-answer__textarea"></textarea>
      </div>
    </section>

    <button class="btn-submit">Valider</button>
  </main>

  <script src="/src/main.js" type="module"></script>
</body>

</html>
