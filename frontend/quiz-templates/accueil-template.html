<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four des Casseaux - Accueil Quiz</title>
  <link href="../style.css" rel="stylesheet">
</head>

<body class="app accueil-page">
  <header class="accueil-header">
    <button class="accueil-header__back" aria-label="Retour">
      <svg class="accueil-header__back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <img class="accueil-header__logo" src="../assets/logo.png" alt="Logo Four des Casseaux">
  </header>

  <main class="accueil-main">
    <section class="accueil-content" aria-labelledby="accueil-title">
      <h1 id="accueil-title" class="accueil-title">Bienvenue !</h1>
      <p class="accueil-text">
        Prenez votre temps, aidez-vous du contenu des videos 3D et des panneaux pour vos reponses.
      </p>
      <p class="accueil-subtext">Bonne chance !</p>
    </section>

    <a href="./loading-template.html" class="accueil-start-btn" onclick="sessionStorage.setItem('fromAccueil', 'true')"
      aria-label="Commencer le quiz">
      <span>Commencer</span>
      <img class="accueil-start-btn__icon" src="../assets/arrow.png" alt="">
    </a>
  </main>

  <script src="../main.js" type="module"></script>
</body>

</html>
