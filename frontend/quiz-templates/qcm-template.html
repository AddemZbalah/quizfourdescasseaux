<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four des Casseaux - QCM</title>
  <link href="../style.css" rel="stylesheet">
</head>

<body class="app">
  <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-screen__inner">
      <img class="loading-screen__logo" src="../assets/logo.png" alt="Logo Four des Casseaux">
      <p id="loadingMessage" class="loading-screen__message">La visite commence par l'etage...</p>
    </div>
  </div>

  <header class="header">
    <button class="header__button" aria-label="Retour">
      <svg class="header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <img class="header__logo" src="../assets/logo.png" alt="Logo Four des Casseaux">
    <button class="header__button" aria-label="Menu">
      <svg class="header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12h18M3 6h18M3 18h18" />
      </svg>
    </button>
  </header>

  <main class="main-content">
    <section class="question-info">
      <h1 class="question-info__title">QUESTION</h1>
      <p class="question-info__progress" id="progress-indicator">{{ordre}}/{{total}}</p>
    </section>

    <section class="card">
      <div class="card__question-text">
        <p id="question-title" class="card__question-title">{{ordre}}. {{question}}</p>
        <p id="question-hint" class="card__hint" hidden>{{indice}}</p>
      </div>

      <div id="qcm-options-container" class="qcm-options">
        {{reponses}}
      </div>
    </section>

    <form action="./text-template.html" class="form-action">
      <button type="submit" class="btn-submit">
        <span class="btn-submit__text">Valider</span>
        <img class="btn-submit__icon" src="../assets/arrow.png" alt="">
      </button>
    </form>
  </main>

  <script src="../main.js" type="module"></script>
</body>

</html>
